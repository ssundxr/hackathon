name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            echo "--- Starting Staging Deployment ---"
            
            # Install Docker & Docker Compose if missing
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi
            
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo apt-get install -y docker-compose-plugin
            fi
            
            # Setup repository directory
            PROJECT_DIR="$HOME/hackathon-staging"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Cloning staging repository..."
              rm -rf "$PROJECT_DIR"
              git clone https://github.com/ssundxr/hackathon.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            
            echo "Fetching latest changes..."
            git fetch --all
            git reset --hard origin/develop
            
            # Write environment secrets
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            
            echo "Running Docker Compose (Staging)..."
            # Stop existing host Nginx to free port 80 if running
            if systemctl is-active --quiet nginx; then
              echo "Stopping host nginx to free port 80..."
              sudo systemctl stop nginx
              sudo systemctl disable nginx
            fi
            
            sudo docker compose -f docker-compose.staging.yml down
            sudo docker compose -f docker-compose.staging.yml up --build -d
            
            echo "--- Staging Deployment Finished Successfully! ---"
