name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version-group: '3.11'
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Syntax Checks
        run: |
          # Check for Python syntax errors or undefined names
          python -m pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,frontend

      - name: Run PyTest Suite
        run: |
          # Only run if tests exist
          if [ -d "tests" ] || [ -f "pytest.ini" ]; then
            python -m pip install pytest httpx
            python -m pytest
          else
            echo "No tests found."
          fi

  validate-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

  validate-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: |
          docker compose -f docker-compose.staging.yml build
